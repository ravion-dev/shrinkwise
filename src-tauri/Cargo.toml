[package]
name = "shrinkwise"
version = "3.0.0"
description = "ShrinkWise - Single-slider multi-format compression & AI media upscaling console"
authors = ["ShrinkWise"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "shrinkwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt-multi-thread", "macros"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
which = "7"
walkdir = "2"
globset = "0.4"
rayon = "1"
filetime = "0.2"

image = { version = "0.25", default-features = false, features = [
  "jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga", "dds", "pnm",
] }
jpeg-encoder = "0.6"
webp = "0.3"

brotli = "7"
xz2 = "0.1"
zstd = "0.13"
flate2 = "1"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
